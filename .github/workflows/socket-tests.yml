name: Dash socket tests

on:
  pull_request:
  push:
    branches: ['ci/dash-socket-tests-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket-tests:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare the stock Dash build tools
        run: |
          xcodebuild -version
          command -v autoconf >/dev/null || brew install autoconf
          command -v automake >/dev/null || brew install automake
      - name: Audit six frameworks and run native Dash regressions
        run: bash tests/socket-ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dash-socket-logs
          include-hidden-files: true
          if-no-files-found: ignore
          path: .build/socket-ci/run.*/*.log
